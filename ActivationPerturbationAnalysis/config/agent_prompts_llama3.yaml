# ============================================================
# Activation Perturbation Analysis — Agent Prompts + Llama-3-8B
# ============================================================
# Uses real agent prompts extracted from vLLM logs.
# Context lengths are determined by the actual prompt token counts.

# --- Model ---------------------------------------------------
model:
  path: "/root/share/models/Meta-Llama-3-8B-Instruct"
  dtype: "bfloat16"
  max_memory_per_gpu_gb: 75
  trust_remote_code: false

# --- GPU scheduling ------------------------------------------
gpu:
  min_free_memory_gb: 20
  max_parallel_experiments: 1
  detect_automatically: true

# --- Experiment sweep ----------------------------------------
# NOTE: context_lengths is ignored when source=jsonfile;
#       each prompt's actual token count is used instead.
sweep:
  context_lengths: []

  perturbation_positions:
    - 0.10
    - 0.25
    - 0.50
    - 0.75
    - 0.90

  perturbation_span_lengths:
    - 8
    - 32
    - 128

  perturbation_types:
    - "random_replace"
    - "mask"
    - "delete"
    - "compress"
    - "paraphrase"
    - "semantic_change"

# --- Distance-based measurement -----------------------------
measurement:
  immediate_window: 10
  short_window: 100
  periodic_sampling_step: 100
  periodic_sampling_width: 10

# --- Prompt generation (jsonfile mode) ----------------------
prompts:
  source: "jsonfile"
  jsonfile_path: "prompt/extracted_prompts.json"
  seed: 42
  num_prompt_candidates: 50

# --- Result storage -----------------------------------------
storage:
  output_dir: "./Llama-3-8B-agent-results"
  format: "parquet"
  checkpoint_every: 10

# --- Logging ------------------------------------------------
logging:
  level: "INFO"
  log_file: "./Llama-3-8B-agent-results/experiment.log"
